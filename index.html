<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartOrder – Konfigurator Zamówień Online</title>
  <meta name="description" content="Szybki konfigurator produktów z live kalkulacją i podglądem. Zbuduj swój produkt online.">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/6816/6816610.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-white min-h-screen text-gray-800">
  <section class="text-center py-20 px-4">
    <h1 class="text-5xl font-extrabold mb-4 tracking-tight bg-gradient-to-r from-indigo-600 to-pink-500 text-transparent bg-clip-text">
      SmartOrder
    </h1>
    <p class="text-xl mb-6 max-w-xl mx-auto">
      Twój własny konfigurator produktów online z podglądem, ceną i opcją przesyłania projektu.
    </p>
    <a href="#konfigurator" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-lg">
      Uruchom konfigurator
    </a>
  </section>

  <section id="konfigurator" class="py-16">
    <div class="max-w-6xl mx-auto grid lg:grid-cols-2 gap-8 px-4">
      <div class="bg-white/70 backdrop-blur-xl shadow-xl rounded-3xl p-8">
        <h2 class="text-2xl font-bold mb-6 text-indigo-700">Konfiguruj swój produkt</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium">Typ produktu</label>
            <select id="product-type" class="w-full p-2 rounded border">
              <option value="etui">Etui na telefon</option>
              <option value="plakat">Plakat A3</option>
              <option value="koszulka">Koszulka</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium">Materiał</label>
            <select id="material" class="w-full p-2 rounded border">
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium">Nadruk</label>
            <select id="print" class="w-full p-2 rounded border">
              <option value="yes">Tak</option>
              <option value="no">Nie</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium">Ilość sztuk</label>
            <input type="number" id="quantity" value="1" min="1" class="w-full p-2 rounded border" />
          </div>
          <div>
            <label class="block text-sm font-medium">Prześlij plik (opcjonalnie)</label>
            <input type="file" id="upload" accept="image/*" class="w-full" />
          </div>
          <div class="text-lg bg-indigo-100 text-indigo-800 p-3 rounded-xl">
            Cena: <span id="price">0,00</span> zł netto
          </div>
          <button id="submit" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl">
            Zamów teraz
          </button>
        </div>
      </div>

      <div class="bg-white/80 backdrop-blur-xl shadow-xl rounded-3xl p-8 flex flex-col items-center">
        <h2 class="text-2xl font-bold text-indigo-700 mb-4">Podgląd produktu</h2>
        <canvas id="preview" width="400" height="400" class="border rounded-xl"></canvas>
      </div>
    </div>
  </section>

  <footer class="text-center py-8 text-sm text-gray-500">
    © 2025 SmartOrder by Tomasz Pałus. Wszystkie prawa zastrzeżone.
  </footer>

  <script>
    const pricing = {
      etui: { base: 25, material: { standard: 0, premium: 10 }, print: { yes: 5, no: 0 }, discount: { threshold: 10, percent: 10 } },
      plakat: { base: 15, material: { standard: 0, premium: 5 }, print: { yes: 0, no: 0 }, discount: { threshold: 20, percent: 15 } },
      koszulka: { base: 30, material: { standard: 0, premium: 12 }, print: { yes: 7, no: 0 }, discount: { threshold: 5, percent: 5 } }
    };

    const productType = document.getElementById("product-type");
    const material = document.getElementById("material");
    const print = document.getElementById("print");
    const quantity = document.getElementById("quantity");
    const priceEl = document.getElementById("price");
    const upload = document.getElementById("upload");
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");

    function calculatePrice() {
      const type = productType.value, mat = material.value, prt = print.value, qty = parseInt(quantity.value);
      const conf = pricing[type];
      let unitPrice = conf.base + conf.material[mat] + conf.print[prt];
      if (qty >= conf.discount.threshold) unitPrice *= (1 - conf.discount.percent / 100);
      priceEl.textContent = (unitPrice * qty).toFixed(2);
    }

    [productType, material, print, quantity].forEach(el =>
      el.addEventListener("change", () => { calculatePrice(); drawPreview(); })
    );

    upload.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.src = reader.result;
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
      };
      reader.readAsDataURL(file);
    });

    function drawPreview() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f3f4f6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#1e293b";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText("Typ: " + productType.value, 20, 40);
      ctx.fillText("Materiał: " + material.value, 20, 80);
      ctx.fillText("Nadruk: " + print.value, 20, 120);
      ctx.fillText("Sztuk: " + quantity.value, 20, 160);
    }

    calculatePrice();
    drawPreview();

    document.getElementById("submit").addEventListener("click", () =>
      alert("Zamówienie zostało zapisane (symulacja).")
    );
  </script>
</body>
</html>
